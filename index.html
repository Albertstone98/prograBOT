<style>
/* =====================================================
   TOKENS & TIPOGRAFÍA (Optimizado para Moodle / 490px)
   ===================================================== */

html, body {

}

body {

    radial-gradient(1200px 600px at 15% -10%, rgba(87,217,201,0.06), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(232,179,57,0.05), transparent 55%),

}

/* =====================================================

}

.dots {

.dots span {

}

.dots span:nth-child(1) { background: #e8607a; }
.dots span:nth-child(2) { background: #e8b339; }

.filetab {

/* =====================================================

.msg {

@keyframes rise {

.msg .who {

.msg .bubble p {

}

.msg .bubble p:last-child {

}

.msg .bubble a {

.msg .bubble a:hover {

.msg.bot {

.msg.bot .bubble {

.msg.user .bubble {

/* =====================================================
   BOTÓN DE LECTURA POR VOZ (SPEECH SYNTHESIS)

.bot-footer {

  align-items: center;

.btn-speech:hover {

.btn-speech.speaking {

.typing {

.typing span {

.typing span:nth-child(2) { animation-delay: .15s; }

/* =====================================================
   BARRA DE ENTRADA (INPUTBAR)

.inputbar {

<body>

<div class="titlebar">
  <div class="dots"><span></span><span></span><span></span></div>
  <div class="filetab">maxiBOT<b>.cpp</b></div>
  <div class="status-pill" id="statusPill" role="status" aria-live="polite">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Cargando base…</span>
  </div>
</div>

<header class="hero">
  <p class="eyebrow"># cátedra_programación_1 / asistente virtual</p>
  <h1>Maxi<span class="amp">BOT</span></h1>
  <p>Preguntame sobre pautas, fechas, TPI o cursada. Escribí <b>comandos</b> o <b>/comandos</b>.</p>
</header>

<main>
  <div class="quickmenu" id="quickmenu" aria-label="Consultas frecuentes"></div>

  <div class="chatwindow">
    <div class="chatlog" id="chatlog" role="log" aria-live="polite" tabindex="0"></div>
    <div class="inputbar">
      <label for="userInput" style="position:absolute; left:-9999px;">Escribí tu consulta</label>
      <textarea id="userInput" rows="1" placeholder="Ingresá palabras clave o escribí comandos..."></textarea>
      <button class="sendbtn" id="sendBtn" type="button">Enviar</button>
    </div>
  </div>
</main>

<footer class="note">// MaxiBOT responde en base al material oficial de Programación 1.</footer>

<script>
/* =====================================================
   CONFIGURACIÓN DE LA BASE DE DATOS
   ===================================================== */
const ARCHIVO_JSON = 'base_conocimiento.json';

let BASE_CONOCIMIENTO = [];
let MOTOR_BUSQUEDA = null;
let CARGA_COMPLETA = false;

/* =====================================================
   ACCESOS RÁPIDOS
   ===================================================== */
const ACCESOS_RAPIDOS = [
  { tag: '01', texto: 'Unidades Temáticas', targetId: 'unidades_tematicas' },
  { tag: '02', texto: 'Aprobación Directa', targetId: 'aprobacion_directa' },
  { tag: '03', texto: 'Recuperatorios (29/09)', targetId: 'habilitacion_recuperatorios_etapa1' },
  { tag: '04', texto: 'Grupos y Pautas TPI', targetId: 'grupos_tpi' },
  { tag: '05', texto: 'Defensas TPI (Noviembre)', targetId: 'fechas_defensas_tpi' },
  { tag: '06', texto: 'Zoom y Horarios', targetId: 'enlace_zoom' }
];

/* =====================================================
   REFERENCIAS UI
   ===================================================== */
const chatlog = document.getElementById('chatlog');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const quickmenu = document.getElementById('quickmenu');

/* =====================================================
    FORMATEADOR DE MARKDOWN LIMPIO (Negritas e Itálicas)
   ===================================================== */
function formatearRespuesta(texto){
  let res = texto.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

  res = res.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  res = res.replace(/__(.*?)__/g, '<strong>$1</strong>');
  res = res.replace(/\*(.*?)\*/g, '<em>$1</em>');
  res = res.replace(/_(.*?)_/g, '<em>$1</em>');
  res = res.replace(/`(.*?)`/g, '<code>$1</code>');

  return res
    .split(/\n{2,}/)
    .map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`)
    .join('');
}

/* =====================================================
   LECTOR DE VOZ ACCESIBLE (Web Speech API)
   ===================================================== */
let vozSeleccionada = null;

function cargarVoces(){
  if (!('speechSynthesis' in window)) return;
  const voces = window.speechSynthesis.getVoices();
  vozSeleccionada = voces.find(v => v.lang === 'es-AR') ||
                    voces.find(v => v.lang.startsWith('es-419')) ||
                    voces.find(v => v.lang.startsWith('es-')) ||
                    voces.find(v => v.lang.includes('es')) ||
                    null;
}

if ('speechSynthesis' in window){
  cargarVoces();
  window.speechSynthesis.onvoiceschanged = cargarVoces;
}

function detenerLectura(){
  if ('speechSynthesis' in window && window.speechSynthesis.speaking){
    window.speechSynthesis.cancel();
  }
  document.querySelectorAll('.btn-speech').forEach(btn => {
    btn.classList.remove('speaking');
    btn.setAttribute('aria-label', 'Escuchar respuesta en voz alta');
    btn.innerHTML = '<span>🔊</span><span>Escuchar</span>';
  });
}

function reproducirVoz(textoPlano, boton){
  if (!('speechSynthesis' in window)){
    alert("Tu navegador no soporta lectura por voz.");
    return;
  }

  if (boton.classList.contains('speaking')){
    detenerLectura();
    return;
  }

  detenerLectura();

  const temporal = document.createElement('div');
  temporal.innerHTML = formatearRespuesta(textoPlano);
  const textoLimpio = temporal.textContent || temporal.innerText || "";
  const textoFinal = textoLimpio.replace(/https?:\/\/[^\s]+/g, 'el enlace de zoom');

  const utterance = new SpeechSynthesisUtterance(textoFinal);
  utterance.lang = 'es-AR';
  utterance.rate = 1.0;
  if (vozSeleccionada) utterance.voice = vozSeleccionada;

  utterance.onstart = () => {
    boton.classList.add('speaking');
    boton.setAttribute('aria-label', 'Detener lectura en voz alta');
    boton.innerHTML = '<span>⏹</span><span>Detener</span>';
  };

  utterance.onend = utterance.onerror = () => {
    boton.classList.remove('speaking');
    boton.setAttribute('aria-label', 'Escuchar respuesta en voz alta');
    boton.innerHTML = '<span>🔊</span><span>Escuchar</span>';
  };

  window.speechSynthesis.speak(utterance);
}

/* =====================================================
   RENDERIZADO DE MENSAJES (ESTILO WHATSAPP: SCROLL FIJO ARRIBA AL RESPONDER EL BOT)
   ===================================================== */
function agregarMensaje(rol, textoPlano){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (rol === 'bot' ? 'bot' : 'user');

  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = rol === 'bot' ? 'MaxiBOT' : 'Vos';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatearRespuesta(textoPlano);

  if (rol === 'bot'){
    const footer = document.createElement('div');
    footer.className = 'bot-footer';

    const btnSpeech = document.createElement('button');
    btnSpeech.type = 'button';
    btnSpeech.className = 'btn-speech';
    btnSpeech.setAttribute('aria-label', 'Escuchar respuesta en voz alta');
    btnSpeech.innerHTML = '<span>🔊</span><span>Escuchar</span>';
    btnSpeech.addEventListener('click', () => reproducirVoz(textoPlano, btnSpeech));

    footer.appendChild(btnSpeech);
    bubble.appendChild(footer);
  }

  wrap.appendChild(who);
  wrap.appendChild(bubble);
  chatlog.appendChild(wrap);

  // COMENTARIO DE COMPORTAMIENTO:
  // Si es un mensaje del usuario ('user'), bajamos el scroll al fondo.
  // Si es una respuesta del bot ('bot'), NO forzamos el scroll al final, 
  // permitiendo que el usuario lea desde el principio del mensaje.
  if (rol === 'user') {
    chatlog.scrollTop = chatlog.scrollHeight;
  }

  return wrap;
}

function mostrarEscribiendo(){
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typingIndicator';
  wrap.innerHTML = `<div class="who">MaxiBOT</div>
    <div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>`;
  chatlog.appendChild(wrap);
  chatlog.scrollTop = chatlog.scrollHeight;
}

function quitarEscribiendo(){
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function renderMenu(){
  quickmenu.innerHTML = '';
  ACCESOS_RAPIDOS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'qbtn';
    btn.type = 'button';
    btn.innerHTML = `<span class="tag">${item.tag}</span><span>${item.texto}</span>`;
    btn.addEventListener('click', () => manejarConsultaPorId(item.texto, item.targetId));
    quickmenu.appendChild(btn);
  });
}

function actualizarEstado(texto, tipo){
  statusText.textContent = texto;
  statusDot.className = 'status-dot' + (tipo ? ' ' + tipo : '');
}

/* =====================================================
   CARGA DE BASE DE DATOS Y CONFIGURACIÓN FUSE.JS
   ===================================================== */
async function inicializarBase(){
  try {
    actualizarEstado('Cargando base…');
    const resp = await fetch(ARCHIVO_JSON, { cache: 'no-store' });
    
    if (!resp.ok){
      throw new Error(`HTTP ${resp.status} al cargar ${ARCHIVO_JSON}`);
    }

    BASE_CONOCIMIENTO = await resp.json();

    const opcionesFuse = {
      includeScore: true,
      threshold: 0.52,
      ignoreLocation: true,
      findAllMatches: true,
      minMatchCharLength: 3,
      keys: [
        { name: 'keywords', weight: 0.55 },
        { name: 'preguntas_ejemplo', weight: 0.30 },
        { name: 'tema', weight: 0.10 },
        { name: 'respuesta', weight: 0.05 }
      ]
    };

    MOTOR_BUSQUEDA = new Fuse(BASE_CONOCIMIENTO, opcionesFuse);
    CARGA_COMPLETA = true;

    actualizarEstado('Base lista', 'ready');
    agregarMensaje('bot', '¡Hola! Soy MaxiBOT, el asistente virtual de Programación 1 🧑‍💻 Escribí **comandos** (o **/comandos**) para ver la ayuda.');

  } catch (error){
    console.error("MaxiBOT - Error cargando JSON:", error);
    actualizarEstado('Error al cargar', 'error');
    agregarMensaje('bot', 'Hubo un inconveniente al cargar `base_conocimiento.json`. Verificá que el archivo esté subido en GitHub Pages.');
  }
}

/* =====================================================
   MOTOR DE CONSULTAS Y COMANDO COMANDOS (/ O SIN /)
   ===================================================== */
function consultarBase(consulta){
  let textoLimpio = consulta.trim().toLowerCase();
  if (textoLimpio.startsWith('/')) {
    textoLimpio = textoLimpio.substring(1);
  }

  if (textoLimpio === 'comandos') {
    let listado = "📋 **Listado de Palabras Clave Disponibles:**\n\n";
    BASE_CONOCIMIENTO.forEach(item => {
      const descripcion = item.preguntas_ejemplo ? item.preguntas_ejemplo[0] : item.tema;
      
      let unaKeyword = item.keywords && item.keywords.length > 0 ? item.keywords[0].split(' ')[0] : item.id;
      if (unaKeyword.startsWith('/')) unaKeyword = unaKeyword.substring(1);
      
      // Mostramos la palabra clave precedida por la barra sin espacios
      listado += `• **\`/${unaKeyword}\`** ➔ *${descripcion}*\n`;
    });
    listado += "\n💡 *Escribí cualquiera de estas palabras clave en el chat (con o sin barra, ej: `tpi` o `/tpi`) para consultar su respuesta.*";
    return listado;
  }

  if (!MOTOR_BUSQUEDA) return null;

  // Limpiamos la consulta del usuario por si incluye barra al inicio para que Fuse.js busque la palabra clave limpia
  let queryLimpia = consulta.trim().toLowerCase();
  if (queryLimpia.startsWith('/')) {
    queryLimpia = queryLimpia.substring(1);
  }

  queryLimpia = queryLimpia
    .replace(/[¿?¡!.,;:()]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  const resultados = MOTOR_BUSQUEDA.search(queryLimpia);

  if (resultados.length > 0 && resultados[0].score <= 0.52){
    return resultados[0].item.respuesta;
  }
  return null;
}

function manejarConsulta(textoVisible){
  agregarMensaje('user', textoVisible);
  userInput.value = '';
  ajustarAltoTextarea();

  if (!CARGA_COMPLETA){
    setTimeout(() => {
      agregarMensaje('bot', 'Todavía estoy cargando la base de conocimiento. Probá de nuevo en un segundo.');
    }, 200);
    return;
  }

  mostrarEscribiendo();

  setTimeout(() => {
    quitarEscribiendo();

    const respuesta = consultarBase(textoVisible);

    if (respuesta){
      agregarMensaje('bot', respuesta);
    } else {
      agregarMensaje('bot', 'No encontré información exacta sobre esa consulta. Escribí **comandos** (o **/comandos**) para ver el listado de palabras clave disponibles.');
    }
  }, 350 + Math.random() * 200);
}

function manejarConsultaPorId(textoBoton, targetId){
  agregarMensaje('user', textoBoton);
  userInput.value = '';
  ajustarAltoTextarea();

  mostrarEscribiendo();

  setTimeout(() => {
    quitarEscribiendo();
    const item = BASE_CONOCIMIENTO.find(i => i.id === targetId);
    if (item) {
      agregarMensaje('bot', item.respuesta);
    } else {
      agregarMensaje('bot', 'No pude encontrar la sección solicitada en la base.');
    }
  }, 250);
}

/* =====================================================
   EVENTOS DE ENTRADA
   ===================================================== */
function ajustarAltoTextarea(){
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 80) + 'px';
}

userInput.addEventListener('input', ajustarAltoTextarea);

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    enviarDesdeInput();
  }
});

sendBtn.addEventListener('click', enviarDesdeInput);

function enviarDesdeInput(){
  const texto = userInput.value.trim();
  if (!texto) return;
  manejarConsulta(texto);
}

/* =====================================================
   INICIO
   ===================================================== */
renderMenu();
inicializarBase();
</script>
